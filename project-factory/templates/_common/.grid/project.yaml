# .grid/project.yaml — project facts for grid agents deployed into this repo.
#
# `agent-factory/deploy.py <this-repo> --roles ...` injects these into every
# deployed agent as a "Project context" section. Keep it to FACTS an agent
# can't get from the role itself: real paths, real commands, hard invariants,
# and what exists vs. what is only planned. See AGENTS-SETUP.md.
#
# Everything is optional; this file as shipped (all comments) is valid.

# context: |
#   - Run the app:      <command>
#   - Run the tests:    <command>   (state which suites exist and which are NOT in the pre-commit hook)
#   - Hard invariants:  <e.g. never call the real model API in tests; logs carry ids/codes, never user content>
#   - Hand-synced mirrors (change both sides together): <fileA> <-> <fileB>
#   - Exists vs planned: <e.g. "CI: not yet", "eval harness: tooling only, no labelled set">

# roles:                       # extra facts for one deployed role only
#   sdet: |
#     - Test suites live in <path>; fixtures in <path>.

# hooks:                       # opt in to the-grid's guard hooks; `agent-factory/deploy_hooks.py <this-repo>` writes them
#   profile: off               # off      - nothing (the default when this key is absent)
#                              # minimal  - blocks git --no-verify, hook-disabling config and force-push
#                              # standard - minimal + blocks commits that add a secret-looking line
#                              # strict   - same as standard for now
#   target: local              # local  - .claude/settings.local.json (machine-local, the default)
#                              # shared - .claude/settings.json (committed; commands carry no absolute path)

# learning: on                 # opt in to instincts: learn working habits from your own sessions in this repo
#                              # captures: tool names, scrubbed and truncated command/prompt text (secrets redacted)
#                              # stored:   raw observations in ~/.grid/instincts/ on this machine only (never synced, never committed)
#                              # forget:   scripts/instincts.sh forget <project-id> --yes
#                              # emitted by `agent-factory/deploy_hooks.py <this-repo>` under any hooks profile, even off
#                              # see docs/instincts.md in the-grid
