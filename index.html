<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the-grid</title>
  <style>
    /* System font stack — no network requests */
    :root {
      --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

      /* Colour tokens — dark background, high contrast */
      --bg:         #0d0d0f;
      --surface:    #141418;
      --border:     #252530;
      --text:       #d8d8e0;
      --text-dim:   #7878a0;
      --accent:     #5b8af0;
      --accent-dim: #2a3d6b;
      --code-bg:    #1a1a22;
      --tag-wired:  #1d3d2f;
      --tag-wired-text: #5fbd8a;
      --tag-lib:    #2b2240;
      --tag-lib-text: #9b82e8;
      --tag-ref:    #2a2215;
      --tag-ref-text: #c99a4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      /* Centre with a sensible max-width; fluid below it */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover, a:focus { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    /* ── Layout shell ── */
    .page-wrap {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Header (legacy styles — kept to avoid removing pre-existing code) ──
       The hero overrides these via .hero specificity. The border-bottom
       is suppressed on .hero since the hero uses its own bottom treatment.
    ── */
    header:not(.hero) {
      border-bottom: 1px solid var(--border);
      padding: 3rem 0 2.5rem;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      /* Subtle grid-line glow as decoration; purely visual */
    }

    /* Decorative rule — hidden from screen readers */
    .logo-rule {
      display: block;
      height: 2px;
      width: 3.5rem;
      background: var(--accent);
      margin: 0.75rem 0 1rem;
      border-radius: 1px;
    }

    .tagline {
      font-size: 1.05rem;
      color: var(--text-dim);
      max-width: 55ch;
    }

    /* ── Main content ── */
    main { flex: 1; padding: 3rem 0; }

    section { margin-bottom: 3.5rem; }

    h2 {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
    }

    p { max-width: 70ch; margin-bottom: 0.9rem; }
    p:last-child { margin-bottom: 0; }

    /* ── Tier cards ── */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .tier-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .tier-card h3 {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    /* Tier label badges */
    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.15em 0.55em;
      border-radius: 4px;
      margin-left: 0.4rem;
      vertical-align: middle;
      /* decorative — aria-hidden set in markup */
    }

    .badge-wired  { background: var(--tag-wired);  color: var(--tag-wired-text); }
    .badge-lib    { background: var(--tag-lib);    color: var(--tag-lib-text); }
    .badge-ref    { background: var(--tag-ref);    color: var(--tag-ref-text); }

    .tier-card p {
      font-size: 0.92rem;
      color: var(--text-dim);
      margin-bottom: 0;
    }

    .tier-card code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--text);
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    /* ── Key files table ── */
    .files-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    .files-table th {
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0.5rem 1rem 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .files-table td {
      padding: 0.65rem 1rem 0.65rem 0;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .files-table tr:last-child td { border-bottom: none; }

    .files-table code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--accent);
      white-space: nowrap;
    }

    .files-table td:last-child {
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ── Commands ── */
    .command-block {
      margin-bottom: 1.75rem;
    }

    .command-block h3 {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      /* Prevent horizontal overflow on narrow screens */
      white-space: pre;
    }

    pre code {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
      background: none;
      padding: 0;
    }

    /* ── Ownership note ── */
    .ownership-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-dim);
      border-radius: 0 6px 6px 0;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .ownership-note code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--text);
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
    }

    .footer-inner {
      font-size: 0.88rem;
      color: var(--text-dim);
    }

    .footer-inner strong { color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      main { padding: 2rem 0; }
      section { margin-bottom: 2.5rem; }

      /* Stack table on very small screens */
      .files-table thead { display: none; }
      .files-table td {
        display: block;
        padding: 0.4rem 0;
        border-bottom: none;
      }
      .files-table tr {
        display: block;
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 0;
      }
      .files-table tr:last-child { border-bottom: none; }
    }

    /* ═══════════════════════════════════════════════════════════════════
       HERO — Tron aesthetic
       All tokens prefixed --hero- to avoid touching existing body tokens.
    ════════════════════════════════════════════════════════════════════ */
    :root {
      --hero-bg:          #02050a;         /* near-black, slightly blue-tinted */
      --hero-cyan:        #00d9ff;         /* Tron primary neon */
      --hero-cyan-dim:    #6ee5ff;         /* softer cyan for body text */
      --hero-cyan-faint:  rgba(0, 217, 255, 0.12); /* grid line colour */
      --hero-amber:       #ffae57;         /* single accent — "I got in." */
      --hero-glow-near:   rgba(0, 217, 255, 0.55);
      --hero-glow-far:    rgba(0, 217, 255, 0);
    }

    /* ── Hero outer shell ──
       Direct child of <body flex-column>, so it stretches full-width
       naturally — no bleed tricks needed. Flex children fill the cross
       axis (width: 100%) by default.
    ── */
    .hero {
      position: relative;
      width: 100%;              /* belt-and-suspenders with flex stretch */
      /* Tall enough to feel cinematic, not so tall it buries content */
      min-height: clamp(560px, 92vh, 860px);
      background: var(--hero-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Fade the hero into the body background at the bottom */
      -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 75%, transparent 100%);
    }

    /* ── Tron perspective grid backdrop ──
       Two layers composited:
       1. Vertical lines — repeating-linear-gradient, no transform.
       2. Horizontal lines — repeating-linear-gradient on a rotateX() plane
          so they appear to recede toward a vanishing point at the horizon.
       aria-hidden is set on the element in markup — purely decorative.
    ── */
    .hero-grid {
      position: absolute;
      inset: 0;
      /* We want the grid to feel like a floor receding toward a horizon,
         so we tilt the entire element back on the X axis. */
      transform-origin: 50% 65%;   /* horizon sits at 65% down the element */
      transform: perspective(600px) rotateX(35deg);

      /* Layer 1 (background): Vertical lines — columns marching to the horizon */
      background:
        /* Vertical lines */
        repeating-linear-gradient(
          90deg,
          var(--hero-cyan-faint) 0px,
          var(--hero-cyan-faint) 1px,
          transparent 1px,
          transparent 60px
        ),
        /* Horizontal lines — these recede with the perspective transform */
        repeating-linear-gradient(
          0deg,
          var(--hero-cyan-faint) 0px,
          var(--hero-cyan-faint) 1px,
          transparent 1px,
          transparent 60px
        );

      /* Drift animation: the grid scrolls toward the viewer (downward in CSS),
         creating the illusion of forward motion through the Grid.
         One full tile (60px) over 4 s = calm, steady drift. */
      animation: grid-drift 4s linear infinite;
    }

    /* Freeze animation for users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .hero-grid { animation: none; }
    }

    @keyframes grid-drift {
      from { background-position: 0 0,    0 0; }
      to   { background-position: 0 60px, 0 60px; }
    }

    /* Radial vignette over the grid — darkens the outer edges so the
       wordmark and quote have a clean, high-contrast reading surface. */
    .hero-vignette {
      position: absolute;
      inset: 0;
      /* Dark centre circle expands to total blackout at the corners */
      background: radial-gradient(
        ellipse 70% 60% at 50% 40%,
        rgba(2, 5, 10, 0.25) 0%,
        rgba(2, 5, 10, 0.80) 60%,
        rgba(2, 5, 10, 0.97) 100%
      );
    }

    /* Horizon glow — a soft horizontal cyan bloom at the vanishing line */
    .hero-horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 48%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        var(--hero-glow-near) 30%,
        var(--hero-cyan) 50%,
        var(--hero-glow-near) 70%,
        transparent 100%
      );
      /* Bloom outward from the line */
      box-shadow:
        0 0 18px 4px  rgba(0, 217, 255, 0.35),
        0 0 60px 16px rgba(0, 217, 255, 0.12);
      opacity: 0.85;
    }

    /* ── Hero content layer (above the grid/vignette) ── */
    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
      max-width: 720px;
      width: 100%;
    }

    /* ── Wordmark — the page's only <h1> ── */
    .hero-wordmark {
      font-family: var(--font-mono);
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--hero-cyan);
      line-height: 1;
      margin: 0 0 2.5rem;
      /* Layered glow: tight core, broad bloom, faint outer halo.
         Three shadows keep it legible — not a blur, a radiance. */
      text-shadow:
        0 0  4px  var(--hero-cyan),
        0 0 16px  rgba(0, 217, 255, 0.75),
        0 0 48px  rgba(0, 217, 255, 0.30),
        0 0 96px  rgba(0, 217, 255, 0.12);
      /* Subtle breathing pulse — very slow, very quiet */
      animation: wordmark-breathe 6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-wordmark { animation: none; }
    }

    @keyframes wordmark-breathe {
      0%,  100% { text-shadow:
        0 0  4px  var(--hero-cyan),
        0 0 16px  rgba(0, 217, 255, 0.75),
        0 0 48px  rgba(0, 217, 255, 0.30),
        0 0 96px  rgba(0, 217, 255, 0.12); }
      50% { text-shadow:
        0 0  6px  var(--hero-cyan),
        0 0 24px  rgba(0, 217, 255, 0.85),
        0 0 64px  rgba(0, 217, 255, 0.40),
        0 0 120px rgba(0, 217, 255, 0.16); }
    }

    /* Narrow accent rule between wordmark and quote — decorative */
    .hero-rule {
      display: block;
      width: clamp(2.5rem, 8vw, 5rem);
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--hero-cyan) 50%,
        transparent
      );
      margin: 0 auto 2.5rem;
      opacity: 0.6;
    }

    /* ── Flynn monologue blockquote ── */
    .hero-quote {
      font-family: var(--font-mono);
      font-size: clamp(0.8rem, 2.2vw, 1.0rem);
      line-height: 2;           /* generous leading — cinematic pacing */
      color: rgba(110, 229, 255, 0.70);   /* dim cyan — legible but not competing with the wordmark */
      font-style: normal;       /* blockquote default italic would break the Tron vibe */
      text-align: center;
      letter-spacing: 0.03em;
      margin: 0;
      border: none;             /* override any UA blockquote indent */
      padding: 0;
    }

    .hero-quote p {
      max-width: none;          /* override body p rule */
      margin-bottom: 0;
    }

    /* Each line of the monologue is a <span> so we can control spacing
       and styling without disrupting the semantic block-level structure. */
    .hero-quote .line {
      display: block;
    }

    /* "I got in." — the punchline. Brighter, slight extra glow. */
    .hero-quote .line-punchline {
      color: var(--hero-cyan);
      text-shadow:
        0 0  4px  rgba(0, 217, 255, 0.80),
        0 0 16px  rgba(0, 217, 255, 0.35);
      letter-spacing: 0.06em;
      margin-top: 0.5em;        /* a beat of silence before the reveal */
    }

    /* ── Hero → body transition ──
       Gradient crossfade from hero near-black to body bg.
       Also a direct flex child of <body>, so width: 100% naturally.
    ── */
    .hero-to-body {
      width: 100%;
      height: 3rem;
      background: linear-gradient(to bottom, var(--hero-bg), var(--bg));
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 480px) {
      .hero { min-height: clamp(480px, 85vh, 700px); }
      /* The perspective grid can feel crowded on mobile; loosen the lines slightly
         by scaling the background-size. We can't easily parameterise the gradient
         stops without CSS custom-property trickery, so we scale the element instead. */
      .hero-grid { background-size: 45px 45px, 45px 45px; }
    }
</head>
<body>

  <!-- ═══════════════════════════════════════════ HERO
       Full-viewport Tron hero. Lives outside .page-wrap so it can bleed
       edge-to-edge. The page-wrap resumes after .hero-to-body.
  ══════════════════════════════════════════════ -->
  <header class="hero" role="banner">

    <!-- Perspective grid backdrop — purely decorative, hidden from screen readers -->
    <div class="hero-grid" aria-hidden="true"></div>

    <!-- Radial vignette darkens edges for text contrast — decorative -->
    <div class="hero-vignette" aria-hidden="true"></div>

    <!-- Horizon glow line — decorative -->
    <div class="hero-horizon" aria-hidden="true"></div>

    <!-- Content: wordmark + monologue, layered above the grid -->
    <div class="hero-content">

      <!-- The page's single <h1>. The existing page had no h1; fixed here. -->
      <h1 class="hero-wordmark">the-grid</h1>

      <!-- Narrow decorative rule — hidden from assistive tech -->
      <span class="hero-rule" aria-hidden="true"></span>

      <!-- Flynn monologue — real selectable text, semantic blockquote.
           cite points to the film and character as the source. -->
      <blockquote class="hero-quote" cite="Tron: Legacy (2010) — Kevin Flynn">
        <p>
          <span class="line">The Grid.</span>
          <span class="line">A digital frontier.</span>
          <span class="line">I tried to picture clusters of information as they moved through the computer.</span>
          <span class="line">What did they look like? Ships? Motorcycles?</span>
          <span class="line">Were the circuits like freeways?</span>
          <span class="line">I kept dreaming of a world I thought I&#8217;d never see.</span>
          <span class="line">And then, one day&#8230;</span>
          <!-- The punchline — brighter, a beat apart -->
          <span class="line line-punchline">I got in.</span>
        </p>
      </blockquote>

    </div><!-- /.hero-content -->

  </header><!-- /.hero -->

  <!-- Gradient crossfade from hero to body — decorative -->
  <div class="hero-to-body" aria-hidden="true"></div>

  <div class="page-wrap">

    <!-- ═══════════════════════════════════════════ MAIN -->
    <main>

      <!-- 1. What it is -->
      <section aria-labelledby="what-heading">
        <h2 id="what-heading">What it is</h2>
        <p>
          the-grid is not a framework and not skills-only. It wires skills from
          across the ecosystem, and it composes and wires AI dev-team agents.
          Agents, machines, MCP servers, prompts, and configs are already growing in.
        </p>
        <p>
          The core mechanic: a single script (<code>wire.sh</code>) symlinks skills
          and composed agents into <code>~/.claude/skills/</code> and
          <code>~/.claude/agents/</code> so Claude picks them up automatically —
          no installs, no config files. the-grid owns some assets directly and pulls
          many more from sibling repos via git submodules.
        </p>
      </section>

      <!-- 2. The two tiers -->
      <section aria-labelledby="tiers-heading">
        <h2 id="tiers-heading">The two tiers</h2>

        <div class="tier-grid">

          <article class="tier-card">
            <h3>
              Wired
              <span class="badge badge-wired" aria-hidden="true">live</span>
            </h3>
            <p>
              Repos listed in <code>wired-submodules.txt</code>. Their skills are
              symlinked live into <code>~/.claude/skills/</code> and active in every
              session. Keep this list small and intentional.
            </p>
          </article>

          <article class="tier-card">
            <h3>
              Library
              <span class="badge badge-lib" aria-hidden="true">indexed</span>
            </h3>
            <p>
              Everything else: indexed in <code>SKILLS.md</code> and searchable via
              <code>skill-scout</code>, but not symlinked. Keeps the active set sane
              even as the-grid indexes thousands of ecosystem skills. Promote to wired
              by adding to the allowlist.
            </p>
          </article>

          <article class="tier-card">
            <h3>
              Reference
              <span class="badge badge-ref" aria-hidden="true">browse</span>
            </h3>
            <p>
              Awesome-lists and indexes with no <code>SKILL.md</code> files. Kept for
              browsing and as a source for <code>skill-scout</code>. Nothing to wire;
              <code>catalog.sh</code> auto-detects and lists them separately.
            </p>
          </article>

        </div>

        <div class="ownership-note" style="margin-top: 1.25rem;">
          <strong>Ownership rule:</strong> root-level dirs are for skills Gareth owns
          or has deliberately forked. Everything else is managed upstream in
          <code>repos/*</code> submodules and wired on demand. When a root dir and a
          submodule share the same skill name, the root copy wins — that's the escape
          hatch for an edited fork. Don't copy an upstream skill to the root just to
          use it; add the repo as a submodule instead.
        </div>
      </section>

      <!-- 3. agent-factory — composed agents -->
      <section aria-labelledby="agent-factory-heading">
        <h2 id="agent-factory-heading">agent-factory — composed agents</h2>

        <p>
          <code>agent-factory/</code> composes AI dev-team agents from three
          orthogonal inputs: <strong>role × stack × skills</strong>. Each input
          is independent — swap a stack overlay without touching the role's
          identity, or bolt on a skill without rewriting anything else.
        </p>

        <div class="tier-grid" style="margin: 1.25rem 0;">

          <article class="tier-card">
            <h3>role</h3>
            <p>
              <em>Who</em> the agent is — Tech Lead, Backend Dev, QA, and so on.
              Stack-agnostic identity, personality, and an operating skill.
              Lives in <code>roles/&lt;role&gt;/</code>.
            </p>
          </article>

          <article class="tier-card">
            <h3>stack</h3>
            <p>
              <em>What</em> it builds on — LAMP, modern-frontend,
              data-engineering…. An overlay appended to the role's operating
              rules. Lives in <code>stacks/&lt;stack&gt;/</code>.
            </p>
          </article>

          <article class="tier-card">
            <h3>skills</h3>
            <p>
              Bolt-on capabilities pulled from the ecosystem (Paperclip, php,
              mysql…). Referenced by name — not copied into the agent output.
            </p>
          </article>

        </div>

        <p>
          A <strong>compose config</strong> names a project and lists agents, each
          as <code>role + stacks[] + skills[] + model</code>. <code>compose.py</code>
          reads it and emits one folder per agent under
          <code>agent-factory/projects/&lt;name&gt;/</code>, rendered to the live
          OpenClaw <strong>5-file identity model</strong>: <code>SOUL.md</code> (how
          it behaves), <code>IDENTITY.md</code> (who it is + model),
          <code>AGENTS.md</code> (boot sequence + async handoff), <code>USER.md</code>
          (who it serves), <code>MEMORY.md</code> (what it carries).
        </p>

        <p>
          <code>compose.py</code> is a <strong>multi-target compiler</strong> — one
          5-file source, a different artefact shape per <code>--target</code>. The
          <code>claude-code</code> target splits on <code>role.yaml orchestrator</code>:
        </p>

        <table class="files-table" style="margin: 1rem 0 1.25rem;">
          <thead>
            <tr>
              <th scope="col">Form</th>
              <th scope="col">Roles</th>
              <th scope="col">How to invoke</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Skill</strong> (orchestrator)</td>
              <td><code>tech-lead</code>, <code>ceo-orchestrator</code></td>
              <td>Slash command — <code>/tech-lead</code>. Transforms the session into that role.</td>
            </tr>
            <tr>
              <td><strong>Subagent</strong> (specialist)</td>
              <td>the other 10 roles</td>
              <td>Not a slash command. Delegate: <em>"Use the backend-dev subagent to…"</em>, or let an orchestrator hand off automatically.</td>
            </tr>
          </tbody>
        </table>

        <div class="command-block">
          <h3>Compose a team and wire it into Claude Code</h3>
          <pre><code># Compose for the Claude Code target
.venv/bin/python agent-factory/compose.py agent-factory/examples/full-team.yaml --target claude-code

# Wire the output — orchestrators → ~/.claude/skills/, specialists → ~/.claude/agents/
bash scripts/wire.sh

# Open a fresh Claude Code session to pick up the new agents, then:
# /tech-lead    ← invoke the orchestrator
</code></pre>
        </div>

        <div class="ownership-note">
          The very agents that maintain the-grid — the Tech Lead orchestrator and
          the Frontend, Backend, and QA specialists — are themselves output of
          agent-factory. The Claude Code target is live today; OpenClaw and
          Paperclip (autonomous) targets are the next work.
        </div>

      </section>

      <!-- 4. Key files -->
      <section aria-labelledby="files-heading">
        <h2 id="files-heading">Key files</h2>

        <table class="files-table">
          <thead>
            <tr>
              <th scope="col">File / dir</th>
              <th scope="col">Purpose</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>agent-factory/</code></td>
              <td>Composes dev-team agents from <code>role × stack × skills</code>. <code>compose.py</code> is the multi-target compiler — one 5-file source, different artefact per <code>--target</code>. <code>wire.sh</code> wires the output live.</td>
            </tr>
            <tr>
              <td><code>scripts/wire.sh</code></td>
              <td>The wiring script. Idempotent — tears down all grid-owned symlinks and rebuilds the wired set each run.</td>
            </tr>
            <tr>
              <td><code>wired-submodules.txt</code></td>
              <td>Allowlist of submodules whose skills are wired live. Anything not listed is library-only.</td>
            </tr>
            <tr>
              <td><code>scripts/catalog.sh</code></td>
              <td>Regenerates <code>SKILLS.md</code>. Deterministic, timestamp-free output. Called automatically by <code>wire.sh</code>.</td>
            </tr>
            <tr>
              <td><code>SKILLS.md</code></td>
              <td>Generated index of the whole ecosystem. Never edit by hand.</td>
            </tr>
            <tr>
              <td><code>scripts/reconcile.sh</code></td>
              <td>Removes stale shadowing dirs on a fresh machine so the-grid owns the slot, then re-wires.</td>
            </tr>
            <tr>
              <td><code>tests/</code></td>
              <td>Bats test suite covering wiring, idempotency, skill format, and submodule health.</td>
            </tr>
            <tr>
              <td><code>repos/</code></td>
              <td>Sibling skill repos as git submodules. Each may contain many skill dirs at any nesting depth.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- 5. Common commands -->
      <section aria-labelledby="commands-heading">
        <h2 id="commands-heading">Common commands</h2>

        <div class="command-block">
          <h3>Bootstrap a new machine</h3>
          <pre><code>git clone https://github.com/&lt;your-username&gt;/the-grid.git ~/.the-grid
cd ~/.the-grid
git submodule update --init --recursive
bash scripts/wire.sh</code></pre>
        </div>

        <div class="command-block">
          <h3>Add a skill</h3>
          <pre><code>mkdir ~/.the-grid/skills/my-skill
# create SKILL.md with name: and description: frontmatter
bash scripts/wire.sh</code></pre>
        </div>

        <div class="command-block">
          <h3>Regenerate the skill catalogue</h3>
          <pre><code>bash scripts/catalog.sh
# wire.sh calls this automatically — rarely needed standalone</code></pre>
        </div>

        <div class="command-block">
          <h3>Add a sibling repo (library by default)</h3>
          <pre><code>git submodule add &lt;repo-url&gt; repos/&lt;name&gt;
git submodule update --init
bash scripts/wire.sh
# To wire it live: add repos/&lt;name&gt; to wired-submodules.txt, then re-run wire.sh</code></pre>
        </div>

        <div class="command-block">
          <h3>Reconcile stale shadows on a fresh machine</h3>
          <pre><code>bash scripts/reconcile.sh          # dry run — list shadowing dirs
bash scripts/reconcile.sh --force  # remove + re-wire</code></pre>
        </div>

        <div class="command-block">
          <h3>Run tests</h3>
          <pre><code>tests/lib/bats-core/bin/bats tests/</code></pre>
        </div>

      </section>
