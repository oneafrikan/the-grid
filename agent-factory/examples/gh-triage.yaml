# gh-triage.yaml — compose config for the GitHub triage agent.
#
# Single-agent team, deployment-agnostic. The composed agent describes HOW to
# triage; WHAT to triage (org, repos, repo→live-system map, Slack on/off) is
# injected per machine via a deployment scope file the cron prompt points at —
# see roles/gh-triage/deployment-scope.template.md. The cron schedule is a
# property of each machine's cron registration, not of this agent.
# See docs/gh-triage-spec.md for full design rationale.

project: gh-triage
slug: grid
description: Autonomous GitHub issue triage — severity classification, mattpocock labels, agent briefs.
paperclip: false

agents:
  - role: gh-triage
    model: sonnet
    cron_model: sonnet
