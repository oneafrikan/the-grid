# gh-triage.yaml — compose config for the GitHub triage agent.
#
# Single-agent team. The main Jarvis agent (OpenClaw, Scout) runs this
# as two cron jobs: Jarvis repos every 60 min, Guide repos every 30 min.
# See docs/gh-triage-spec.md for full design rationale.

project: gh-triage
slug: full-team
description: Autonomous GitHub issue triage — severity classification, mattpocock labels, agent briefs.
paperclip: false

agents:
  - role: gh-triage
    model: sonnet
    cron_model: sonnet
