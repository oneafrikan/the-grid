# grid.yaml — the dev-team project: engineering, product, and marketing.
# Orchestrators (ceo-orchestrator, tech-lead, growth-hacker) emit as Claude
# Code skills; the specialists emit as CC subagents. Models come from each
# role.yaml default unless overridden here.
#
# Sibling projects, same repo (see examples/): `core.yaml` (gh-triage,
# librarian, researcher — cross-desk infra wired on every machine) and
# `finance-desk.yaml` (the personal finance pipeline, standalone). A private
# project can also be composed separately, sourcing its roles from
# GRID_PRIVATE_ROLES_DIR (never committed to this repo) instead of this
# file's roles/ — see compose.py's role_dir() for the mechanism.
#
# Delegation topology (drives the generated roster in each orchestrator's
# AGENTS.md — see compose.py `inject_roster`):
#   ceo  → tech-lead, product-manager, growth-hacker          (the three leads)
#   tech-lead     → engineering + data specialists
#   growth-hacker → the marketing arm (player-coach lead)
# delegates_to entries must name a role present in this team.
#
# General-purpose research is NOT on this team — the `researcher` role moved
# to core.yaml so every machine keeps it regardless of desk gating. Tech Lead
# routes research to core-researcher via the Signal Protocol instead.
project: grid
slug: grid
description: Dev-team project — 3 orchestrators + 16 specialists, all 5-file model.
paperclip: false

agents:
  # orchestrators -> CC skills
  - role: ceo-orchestrator
    delegates_to: [tech-lead, product-manager, growth-hacker]
  - role: tech-lead
    delegates_to:
      - backend-dev
      - frontend-dev
      - designer
      - qa-engineer
      - security-reviewer
      - devops
      - data-engineer
      - data-scientist
      - project-manager
  - role: growth-hacker   # player-coach lead of the marketing arm -> CC skill
    delegates_to: [copywriter, ad-copy, seo, paid-search, paid-social, data-analyst]
  # product + delivery
  - role: product-manager
  - role: project-manager
  # engineering specialists -> CC subagents
  - role: backend-dev
  - role: frontend-dev
  - role: designer
  - role: qa-engineer
  - role: security-reviewer
  - role: devops
  # data specialists
  - role: data-engineer
  - role: data-analyst
  - role: data-scientist
  # marketing specialists (led by growth-hacker)
  - role: copywriter
  - role: ad-copy
  - role: seo
  - role: paid-search
  - role: paid-social
