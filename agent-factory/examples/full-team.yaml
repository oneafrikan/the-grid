# full-team.yaml — the complete composed team, all 20 ported roles.
# Orchestrators (ceo-orchestrator, tech-lead) emit as Claude Code skills;
# the 18 specialists emit as CC subagents. Models come from each role.yaml
# default unless overridden here.
project: full-team
description: Full composed team — 2 orchestrators + 18 specialists, all 5-file model.
paperclip: false

agents:
  # orchestrators -> CC skills
  - role: ceo-orchestrator
  - role: tech-lead
  # product + delivery
  - role: product-manager
  - role: project-manager
  # engineering specialists -> CC subagents
  - role: backend-dev
  - role: frontend-dev
  - role: designer
  - role: qa-engineer
  - role: security-reviewer
  - role: devops
  # data + research specialists
  - role: data-engineer
  - role: data-analyst
  - role: data-scientist
  - role: researcher
  # marketing specialists
  - role: copywriter
  - role: ad-copy
  - role: seo
  - role: growth-hacker
  # paid-media specialists
  - role: paid-search
  - role: paid-social
