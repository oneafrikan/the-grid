# factory.schema.yaml
#
# Describes the shape of a valid *compose config* — the input file you hand to
# compose.py to generate a team. This is documentation-as-schema for now (human
# reference); a machine-enforced version (jsonschema / pydantic) comes when
# compose.py is fleshed out. See docs/architect-agent-composition.yaml for a
# filled-in example.
#
# ── top level ────────────────────────────────────────────────────────────────
# project      (str, required)   slug for the output folder: projects/<project>/
# description  (str, optional)   one-line human description
# paperclip    (bool, optional)  wire Paperclip heartbeat skills into every agent
# agents       (list, required)  one entry per agent on the team
#
# ── per-agent entry ──────────────────────────────────────────────────────────
# role        (str, required)   must match a folder in roles/<role>/
# name        (str, optional)   agent's persona name for IDENTITY.md; defaults to
#                               the role's title (role.yaml `title`) or the slug
# stacks      (list, optional)  overlays from stacks/<stack>/; []=stack-agnostic
# skills      (list, optional)  bolt-on skills from skills/<skill>/ (the role's own
#                               operating skill is always included automatically)
# model       (str, optional)   model string; falls back to role.yaml default_model
# cron_model  (str, optional)   model for scheduled runs; falls back to role.yaml
#
# Each agent renders to the live OpenClaw 5-file identity model —
# SOUL / IDENTITY / AGENTS / USER / MEMORY — plus a skill list (by name).
#
# ── validation rules (enforced by compose.py) ────────────────────────────────
# - every `role` resolves to an existing roles/<role>/ dir
# - every role provides the required files: SOUL.md and SKILL.md
# - every `stack` resolves to an existing stacks/<stack>/ dir
# - every `skill` resolves to an existing skills/<skill>/ dir
# - (future) `model` is one of the allowed model strings (e.g. opus | sonnet | haiku)
# - (future) exactly one orchestrator role present if the team hands off work

schema_version: 0   # bump when the contract changes

required:
  top_level: [project, agents]
  per_agent: [role]

defaults:
  paperclip: false
  stacks: []
  skills: []
  # model: pulled from roles/<role>/role.yaml when omitted
