# role.yaml — qa-engineer
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: qa-engineer
title: QA Engineer        # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  The release gate. Builds test plans, verifies work against PRD acceptance
  criteria, reviews for correctness and edge cases, blocks release on critical issues.
owns: Test plans, acceptance verification, the release gate   # short roster phrase (summary 1st sentence too thin)
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
# Verifies, never fixes: no Edit/Write. Bash stays so it can run the verification command itself;
# Bash can still write files, so this narrows the role, it does not sandbox it.
tools: [Read, Grep, Glob, Bash]
