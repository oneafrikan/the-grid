# role.yaml — data-analyst
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: data-analyst
title: Data Analyst        # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Queries, dashboards, analysis, reporting. Turns a question into a defensible
  answer, with assumptions and caveats stated.
description: "Data Analyst. Queries, dashboards, analysis and reporting, with assumptions and caveats stated. Use to turn a question into a defensible answer."
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
# Runs queries and saves their results through the shell; source stores are read-only by rule.
tools: [Read, Grep, Glob, Bash]
