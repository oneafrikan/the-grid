# role.yaml — finance-manager
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-manager
title: Finance Manager    # human-readable role for IDENTITY.md nameplate
default_model: sonnet
cron_model: haiku         # cheaper model for scheduled/heartbeat runs
summary: >-
  Orchestrates the finance desk pipeline (sentinel -> analyst -> strategist ->
  risk-officer -> your approval queue -> scribe). Routes and grades escalation;
  never sizes a trade, never overrides the Risk Officer, never auto-approves.
owns: Finance desk — market monitoring, evidence, proposals, risk veto, memory
base_skills: []      # skills always included for this role (TBD)
orchestrator: true    # player-coach lite: fronts the pipeline, delegates every stage
