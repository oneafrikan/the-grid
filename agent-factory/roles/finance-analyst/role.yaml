# role.yaml — finance-analyst
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-analyst
title: Finance Analyst    # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Turns a Sentinel flag (or scheduled review) into an evidence pack: what
  happened, primary sources, base rates, and the bull AND bear case argued
  with equal effort. Never recommends — output is evidence, not a proposal.
description: "Finance Analyst. Turns a Sentinel flag or scheduled review into an evidence pack: sources, base rates, bull and bear cases. Never recommends. Use for finance evidence packs."
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
# read-only research plus Write for the evidence pack; no Bash/Edit
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write]
