# role.yaml — finance-scribe
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-scribe
title: Finance Scribe     # human-readable role for IDENTITY.md nameplate
default_model: haiku      # logging is not a reasoning task
summary: >-
  Logs every flag, brief, proposal, approval/rejection, and outcome to the
  vault with full rationale. Runs the monthly post-mortem: what was proposed,
  what the human decided, what happened, was confidence calibrated. Never
  proposes or judges — records only.
description: "Finance Scribe. Logs every flag, brief, proposal, decision and outcome to the vault with rationale; runs the monthly post-mortem. Records only. Use for finance logging and post-mortems."
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
model_rationale: >-
  Logging is not a reasoning task: dated, complete entries, so the cheap tier.
