# role.yaml — martech
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: martech
title: Marketing Technology Specialist   # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Marketing technology: the marketing stack as a system. Stack inventory and
  integration map, tag and data-layer architecture (GTM web + server-side,
  event schema, UTM governance), conversion plumbing (GA4, Google/Microsoft
  Ads, Meta CAPI, Floodlight), HubSpot lifecycle/routing/workflows/suppression,
  BigQuery as the marketing data destination, consent wiring, tool evaluation.
  Advises, audits and writes specs; a human applies changes in the vendor consoles.
description: "Marketing Technology Specialist. Marketing stack as a system: GTM/GA4 tags, conversion plumbing, HubSpot, BigQuery, consent, UTMs. Specs and audits; a human applies. Use for tracking, CRM and consent."
base_skills: []      # skills always included for this role
orchestrator: false
# Bash is here to open PRs (intent only: tools: cannot scope Bash, so it is an unscoped shell). No Edit. No vendor MCP tools (HubSpot, GTM, GA4, ad platforms) are wired: the role specs and audits, a human applies. Residual risk: agent-factory/README.md, "Tool allowlists and residual risk".
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write, Bash]
