# role.yaml — project-manager
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: project-manager
title: Project Manager     # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Delivery management. Turns a plan or PRD into tracked tasks with owners,
  estimates, and dependencies; runs standups, surfaces blockers, reports status
  against the timeline. Does not own scope, architecture, or code.
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
