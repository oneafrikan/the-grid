# role.yaml — technical-writer
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: technical-writer
title: Technical Writer   # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Keeps a repo's documentation true to its code: README, agent guidance files, references, onboarding, changelogs, agent briefs.
owns: >-
  README, CLAUDE.md-style guidance, API/env/command references, onboarding and architecture notes, changelogs, agent briefs and skills as documentation.
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
