# role.yaml — data-engineer
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: data-engineer
title: Data Engineer       # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Pipelines, warehousing, transforms, data quality. Builds to a pipeline spec.
base_skills:         # session-wired skills this role always advertises (CC target)
  - python-pro
  - pandas-pro
  - sql-pro
  - postgres-pro
  - database-optimizer
  - xlsx
  - crm-data-quality   # hubspot/agent-cli-skills
  - crm-lookup         # hubspot/agent-cli-skills
  - bulk-operations    # hubspot/agent-cli-skills
  - data-enrichment    # hubspot/agent-cli-skills
orchestrator: false
