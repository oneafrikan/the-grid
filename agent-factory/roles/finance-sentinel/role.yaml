# role.yaml — finance-sentinel
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-sentinel
title: Finance Sentinel   # human-readable role for IDENTITY.md nameplate
default_model: haiku      # always-on watcher must be cheap
summary: >-
  Polls prices, portfolio state, RSS/filings, and FX against threshold rules.
  95% deterministic; the model only classifies and flags. Never analyses,
  never recommends — its entire vocabulary is "nothing to report" or a flag.
description: "Finance Sentinel. Polls prices, portfolio state, RSS/filings and FX against threshold rules; only classifies and flags. Use for finance monitoring."
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
unattended: true      # runs on a cron heartbeat with no human watching (flags only, read-only data in)
model_rationale: >-
  An always-on heartbeat watcher comparing data to configured thresholds must be cheap.
# Reads untrusted feeds and runs scripts (scripts/run-record.sh): no Edit/Write, no web tools.
# Bash can still write files, so this narrows the role, it does not sandbox it.
tools: [Read, Grep, Glob, Bash]
