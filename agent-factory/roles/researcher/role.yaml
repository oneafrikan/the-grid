# role.yaml — researcher
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: researcher
title: Researcher          # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Desk, web, market, competitive and technical research. Source-grounded,
  fact-checked synthesis with citations. Investigates a question; does not decide.
base_skills: [deep-research]   # the deep-research harness — always available to this role
orchestrator: false
