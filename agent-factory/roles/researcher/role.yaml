# role.yaml — researcher
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: researcher
title: Researcher          # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  General-purpose researcher — any subject, no domain lane. Desk, web, market,
  competitive, literature and technical investigation turned into
  source-grounded, fact-checked synthesis with citations, confidence levels and
  a stated gaps list. Opens with a scoping gate that pins the question, the
  decision it informs, and the depth before spending anything on search.
  Investigates a question; does not decide.
description: "Researcher. General-purpose investigation turned into source-grounded, fact-checked synthesis with citations, confidence levels and gaps. Scopes first; does not decide. Use for research on any subject."
base_skills: [deep-research]   # the deep-research harness — always available to this role
orchestrator: false
# Bash is here to open PRs (intent only: tools: cannot scope Bash, so it is an unscoped shell). No Edit. Residual risk: agent-factory/README.md, "Tool allowlists and residual risk".
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write, Bash]
