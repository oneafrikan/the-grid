# role.yaml — librarian
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: librarian
title: Librarian
default_model: sonnet
summary: >-
  Maintains persistent, cross-linked markdown wikis compiled from other
  agents' research — one wiki per domain. Runs the ingest / query / lint
  cycle (source -> pages -> index -> log), preserves every page's evidence
  tier and provenance in its frontmatter, and never asserts a claim itself.
base_skills: []
orchestrator: false
