# role.yaml — finance-strategist
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-strategist
title: Finance Strategist  # human-readable role for IDENTITY.md nameplate
default_model: fable      # calibration + conflicting-evidence reasoning over long sessions
summary: >-
  Reads an evidence pack + the Investment Policy + portfolio state and
  produces a proposal (hold/trim/add/rebalance) with position size, an
  explicit confidence level, and the strongest argument against its own
  proposal. May not amend the Investment Policy in the same session it
  proposes trades.
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
model_rationale: >-
  Calibration and conflicting-evidence reasoning over long sessions; the proposal is the one
  place on the desk where open judgement matters.
# Reads POLICY.md, the evidence pack and portfolio state handed to it and emits a proposal as text:
# no shell, web or file write is named in its skill. Narrows the role; it does not sandbox it.
tools: [Read, Grep, Glob]
