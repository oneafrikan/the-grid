# role.yaml — paid-social
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: paid-social
title: Paid Social Specialist   # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Paid social: Meta, Instagram, LinkedIn, TikTok. Campaign objective + structure,
  audience strategy (interest / lookalike / custom / Advantage+), creative testing
  and fatigue management, pixel/CAPI tracking, bidding and budget pacing. Plans
  and optimises spend; the human approves the budget.
description: "Paid Social Specialist. Meta, Instagram, LinkedIn, TikTok: campaign structure, audiences, creative testing, tracking, bidding and pacing. Human approves budget. Use for paid social."
base_skills: []      # skills always included for this role (TBD — toprank / abm-ad-creative candidates)
orchestrator: false
# add tools only if an ads API is wired as an MCP tool (reopen H-04)
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write]
