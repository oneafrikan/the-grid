# role.yaml — platform-engineer
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: platform-engineer
title: Platform Engineer   # human-readable role for IDENTITY.md nameplate
default_model: sonnet      # mid tier, same as devops: bounded, checklist-driven execution
summary: >-
  Makes a personal developer environment (dotfiles, shell functions, bootstrap
  scripts, package manifests, per-machine overlays, task runners) work on macOS,
  Ubuntu (desktop and headless) and Arch Linux from one repo. Small, verified
  changes on a branch; the human tests other OSes and decides on merge.
owns: Dotfiles, bootstrap/installer scripts, package manifests, per-machine overlays, cross-OS portability   # short roster phrase
base_skills:         # session-wired skills this role always advertises (CC target); all baseline-wide
  - ponytail                      # smallest diff
  - systematic-debugging          # reproduce before fixing
  - verification-before-completion # RAN vs READ vs UNTESTED, evidence before claims
  - cli-developer                 # installer flags, --dry-run/plan modes, exit codes
orchestrator: false
