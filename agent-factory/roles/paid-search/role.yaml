# role.yaml — paid-search
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: paid-search
title: Paid Search Specialist   # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Paid search / SEM: Google Ads + Microsoft Ads. Account and campaign structure,
  keyword + match-type + negative strategy, Quality Score, bidding and budget
  pacing, conversion tracking, search-term mining. Plans and optimises spend;
  the human approves the budget.
description: "Paid Search Specialist. Google and Microsoft Ads: account structure, keywords, bidding, budget pacing, conversion tracking, search-term mining. Human approves budget. Use for paid search."
base_skills: []      # skills always included for this role (TBD — toprank / paid-ads candidates)
orchestrator: false
# Bash is here only so the role can open a PR (hand-off); no Edit. Add ads-API tools only if wired as an MCP tool (reopen H-04). Residual risk: agent-factory/README.md, "Tool allowlists and residual risk".
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write, Bash]
