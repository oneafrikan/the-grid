# role.yaml — finance-risk-officer
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: finance-risk-officer
title: Finance Risk Officer  # human-readable role for IDENTITY.md nameplate
default_model: haiku     # arithmetic + policy-text check only, not open judgment
summary: >-
  Layer-2 sanity check only: verifies the Strategist's arithmetic and checks
  the proposal's stated rationale against the Investment Policy's text. The
  actual hard-limit veto (position caps, concentration limits, drawdown
  circuit breaker, no leverage/options, cash floor) is Layer 1 pure code in
  finance-agents-base's guardrail/rules.py, not this agent — hard limits
  enforced by an LLM are hard limits enforced by a probability distribution.
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
