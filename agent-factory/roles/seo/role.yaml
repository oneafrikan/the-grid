# role.yaml — seo
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: seo
title: SEO Specialist     # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Technical, on-page, and content SEO: audits, schema/JSON-LD, sitemaps,
  Core Web Vitals, GSC, keyword/intent strategy. Recommends; does not deploy.
description: "SEO Specialist. Technical, on-page and content SEO: audits, schema/JSON-LD, sitemaps, Core Web Vitals, GSC, keyword and intent strategy. Recommends only. Use for SEO audits."
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
# add Bash back only when a crawler CLI is wired for this role
tools: [Read, Grep, Glob, WebFetch, WebSearch, Write]
