# role.yaml — product-manager
# Stack-agnostic role metadata. compose.py reads this for defaults; the
# SOUL.md / SKILL.md (+ identity layers) beside it carry the actual content.
name: product-manager
title: Product Manager     # human-readable role for IDENTITY.md nameplate
default_model: sonnet
summary: >-
  Converts intent into precise specs. Owns scope, acceptance criteria, PRDs, and
  tracer-bullet tickets. Does not architect or implement.
owns: Scope, acceptance criteria, PRDs, tracer-bullet tickets   # short roster phrase (summary 1st sentence too thin)
base_skills: []      # skills always included for this role (TBD)
orchestrator: false
