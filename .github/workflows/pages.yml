name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs pages:write and an OIDC token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No submodules: the site is index.html plus the files in site-files.txt.
      - uses: actions/checkout@v7

      - name: Stage site files
        run: bash scripts/stage-site.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
