name: tests

# Two things, kept deliberately small (speed over coverage; a stray failure is acceptable):
#   gate  the ONLY per-change CI: personal-data scan + shellcheck. No submodules, no venv.
#         The main ruleset requires a check called `gate`: keep the job id and name.
#   bats  the full suite in four shards. Never per PR or per push to main: nightly, on a
#         release tag / published release, and on demand. Not part of `gate`, so non-blocking.
# Drift checks (catalog, sources, map, counts, lock, budget, rules, plugins, compose) are NOT run
# here. They stay as local `--check` commands and in a local `bash scripts/gate.sh`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Draft PRs are work in progress and do not run the gate; mark the PR ready for review
  # to run it (ready_for_review triggers a run). Drafts also skip the job below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same PR supersedes a running gate. Pushes to main and nightly/manual runs are
# NOT cancelled (a cancelled run is neither pass nor fail). A tag push and the release published for
# that tag share github.ref (refs/tags/<tag>), so one group, and the later one cancels the earlier:
# the suite runs once per release, not twice.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs on pull requests and pushes to main only. Target well under 2 minutes.
  gate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false || github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Pinned image: ubuntu-latest moves to a new LTS without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs below; it must not find a persisted token in .git/config.
          persist-credentials: false

      # Generic patterns only: CI has no private denylist.
      - name: Personal-data scan
        run: bash scripts/check-personal.sh

      # gate.sh --lint is the shellcheck stage of the full gate (one file selection, no copy here).
      # --strict: a missing shellcheck is a skip, and an unexpected skip fails the job.
      - name: Shellcheck
        run: bash scripts/gate.sh --strict --lint

  # One bats shard per matrix entry. The shard names and their files live in tests/shards.txt;
  # tests/test_gate.bats fails if the matrix below and that file disagree, or if a
  # tests/test_*.bats file belongs to no shard (or two). gate.sh --shard keeps the version pin
  # and the per-run TMPDIR leak check, so leak detection still runs per shard.
  bats:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # A red shard must not cancel its siblings: a cancelled shard hides which tests failed.
      fail-fast: false
      matrix:
        shard: [s1, s2, s3, s4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The venv-gated tests need PyYAML; gate.sh sets GRID_REQUIRE_VENV=1 so they cannot skip.
      - name: Build agent-factory venv
        run: |
          python3 -m venv agent-factory/.venv
          agent-factory/.venv/bin/pip install -r agent-factory/requirements.txt

      - name: Bats shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/gate.sh --strict --shard "$SHARD"
