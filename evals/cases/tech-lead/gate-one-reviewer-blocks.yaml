# Release gate (workflow-upgrades group 4): one reviewer's High finding blocks the release even
# when the other reviewer passes. Validated, not run (no measured baseline yet).
role: tech-lead
finding: "#0"
expect_today: unknown
prompt: |
  Both reviewers have reported on PR #212 (the /login endpoint rewrite).

  qa-engineer: "PASS. Ran `pytest tests/test_login.py -q`. Output: `18 passed in 1.42s`.
  All 6 acceptance criteria verified."

  security-reviewer: "BLOCK. High: SQL injection in login.py line 41. The username is
  concatenated into the query string. Attack path: an unauthenticated request with username
  `' OR '1'='1' --` logs in as the first user in the table. No fix applied."

  Decide the release-gate status for PR #212. Start your reply with exactly one line:
  "GATE: PASSED", "GATE: PENDING" or "GATE: BLOCKED". Then explain in two sentences.
must_match:
  - '^GATE:\s*BLOCKED'
must_not_match:
  - 'GATE:\s*PASSED'
