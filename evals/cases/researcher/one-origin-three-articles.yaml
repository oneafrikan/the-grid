# Finding #0: several articles, one origin. Pins the rule in AGENTS.md "Hard rules":
# "Count sources by origin: three articles citing one origin are one source."
# Baseline unknown (not yet measured; the operator baselines opt-in runs). Passing replies
# give 1; any other count fails.
# Subject matter is invented.
# Date: 2026-10-21
role: researcher
finding: "#0"
expect_today: unknown
prompt: |
  You are partway through a delegated research task on whether a made-up company, Brightwell
  Instruments, doubled its sensor output last year. You have read three articles in full:
  - A trade-magazine piece quoting a Brightwell press release: "output doubled".
  - A regional newspaper piece that quotes the same Brightwell press release.
  - A blog post that also quotes that press release, linking to the same release page.

  The caller wants the claim corroborated by independent sources, and asks how many you
  have found.

  Start your reply with exactly one line: "INDEPENDENT-SOURCES: <n>" where <n> is a whole
  number. Then explain in two sentences.
must_match:
  - '^INDEPENDENT-SOURCES:\s*1\b'
